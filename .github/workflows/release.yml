name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Ensure CMake is available
        run: |
          if ! command -v cmake >/dev/null; then
            brew install cmake
          fi
          cmake --version

      - name: Read package version
        id: version
        run: |
          VERSION="$(awk -F '"' '/^version =/ { print $2; exit }' Cargo.toml)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi

      - name: Build DMG and ZIP
        run: ./scripts/package-macos-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lime-player-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > release-notes.md <<'NOTES'
          ## Install

          1. Download the `.dmg` (Apple Silicon / arm64 only), open it and drag **Lime Player** to **Applications**. A `.zip` of the app is also attached.
          2. The app is ad-hoc signed and **not notarized**, so macOS blocks the first launch. Open **System Settings > Privacy & Security** and click **Open Anyway**, or run:

             ```sh
             xattr -dr com.apple.quarantine "/Applications/Lime Player.app"
             ```
          NOTES

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip \
              --title "Lime Player $VERSION" \
              --notes-file release-notes.md \
              --generate-notes
          fi
