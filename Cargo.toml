[package]
name = "lime-player"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "A cross-platform Rust and Slint audio player prototype"
license = "GPL-3.0-only"
repository = "https://github.com/zilverjk/lime-player"

[dependencies]
cpal = "0.18.2"
crossbeam-channel = "0.5.15"
directories = "6.0.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15.4"
rtrb = "0.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
symphonia = { version = "0.6.1", default-features = false, features = ["all-meta", "flac", "mp3", "pcm", "wav"] }
thiserror = "2.0"
wavpack = "0.4.0"

[build-dependencies]
slint-build = "1.18.1"

# Dev-only offscreen snapshot harness (`§6` Stage 5): the software renderer plus system fonts so
# `src/ui_snapshot.rs` can render `MainWindow` to PNGs without a GPU, a window server, audio
# hardware or CoreAudio. `image` (PNG encoding) is already a normal dependency above. Never used by
# the shipped binary.
[dev-dependencies]
slint = { version = "1.18.1", features = ["renderer-software", "software-renderer-systemfonts"] }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "0.14.2", default-features = false, features = ["core_audio", "audio_toolbox"] }
